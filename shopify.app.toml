# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ed12e97ba1b3269d49a005940387d498"
application_url = "https://lockrules.173.212.233.194.sslip.io"
embedded = true
name = "LockRules"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products / read_content: resource pickers and lock targets
# read_themes: detect whether the app embed is enabled
# read_validations / write_validations: install the checkout protection function
scopes = "read_products,read_content,read_themes,read_validations,write_validations"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://lockrules.173.212.233.194.sslip.io/api/auth" ]

[build]
automatically_update_urls_on_dev = true
