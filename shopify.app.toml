# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ed12e97ba1b3269d49a005940387d498"
application_url = "https://lockrules.173.212.233.194.sslip.io"
embedded = true
name = "LockRules"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products / write_content: resource pickers, lock targets, seo.hidden
# write_themes: detect the app embed; secure mode theme edits (also needs Shopify's exemption)
# read_locales: list published languages for message translations
# read_validations / write_validations: install the checkout protection function
# write_app_proxy: /apps/lockrules for passcodes, secret links and IP checks
# read_orders / read_customers / write_customers: purchase history keys and registration approval
# read/write_payment_customizations: payment rules function
scopes = "write_products,write_content,write_themes,read_locales,read_validations,write_validations,write_app_proxy,read_orders,read_customers,write_customers,read_payment_customizations,write_payment_customizations"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Needs protected customer data approval (Partner Dashboard > API access) before
  # Shopify accepts these. Uncomment once approved; the handlers already exist.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/paid"
  # topics = [ "orders/paid" ]
  #
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/create"
  # topics = [ "customers/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/themes/publish"
  topics = [ "themes/publish" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "lockrules"

[auth]
redirect_urls = [ "https://lockrules.173.212.233.194.sslip.io/api/auth" ]

[build]
automatically_update_urls_on_dev = true
