query CartValidationsGenerateRunInput(
  $tags: [String!] = []
  $productTags: [String!] = []
  $collectionIds: [ID!] = []
  $d0: DateTimeWithoutTimezone = "2000-01-01T00:00:00"
  $w0s: TimeWithoutTimezone = "00:00:00"
  $w0e: TimeWithoutTimezone = "00:00:01"
) {
  validation {
    config: metafield(namespace: "$app", key: "config") {
      jsonValue
    }
  }
  presentmentCurrencyRate
  shop {
    localTime {
      date
      d0: dateTimeAfter(dateTime: $d0)
      w0: timeBetween(startTime: $w0s, endTime: $w0e)
    }
  }
  localization {
    country {
      isoCode
    }
  }
  cart {
    tokens: attribute(key: "_lr") {
      value
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    buyerIdentity {
      purchasingCompany {
        company {
          id
        }
      }
      customer {
        email
        numberOfOrders
        purchased: metafield(namespace: "$app:lockrules", key: "purchased") {
          jsonValue
        }
        hasTags(tags: $tags) {
          tag
          hasTag
        }
      }
    }
    lines {
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            title
            vendor
            productTags: hasTags(tags: $productTags) {
              tag
              hasTag
            }
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
}
