query CartValidationsGenerateRunInput($tags: [String!] = [], $collectionIds: [ID!] = []) {
  validation {
    config: metafield(namespace: "$app", key: "config") {
      jsonValue
    }
  }
  shop {
    localTime {
      date
    }
  }
  localization {
    country {
      isoCode
    }
    market {
      handle
    }
  }
  cart {
    tokens: attribute(key: "_lr") {
      value
    }
    buyerIdentity {
      customer {
        email
        hasTags(tags: $tags) {
          tag
          hasTag
        }
      }
    }
    lines {
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            title
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
}
